<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KCD Pune — Pune Metro Hero</title>
<style>
:root{--pur:#a23fc0;--ink:#2a2540;--tw:560px;--th:103px;--bs:.76;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow-x:hidden;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans Devanagari",sans-serif;background:#fff;color:var(--ink)}
.hero{position:relative;min-height:100vh;display:flex;flex-direction:column;justify-content:center;overflow:hidden;background:#fff}
.scene{position:relative;height:clamp(560px,70vh,700px);pointer-events:none}
.layer{position:absolute;left:0;right:0;bottom:0;background-repeat:repeat-x}
#far{height:400px;bottom:150px;opacity:.8}#sky{height:464px;bottom:108px}#near{height:150px;bottom:70px}
#world{position:absolute;left:50%;bottom:0;height:100%;width:0;will-change:transform}
.beam{position:absolute;left:0;right:0;bottom:70px;height:20px;background:linear-gradient(#ece9f3,#d3cee2 60%,#bdb6d2);border-top:3px solid var(--pur);box-shadow:0 6px 12px rgba(60,40,100,.18)}
.rail{position:absolute;left:0;bottom:90px;height:4px;background:repeating-linear-gradient(90deg,#9a92b4 0 18px,#7d749c 18px 24px)}
.st{position:absolute;bottom:90px;width:0}
.plat{position:absolute;left:-150px;width:300px;bottom:-2px;height:12px;background:linear-gradient(#fff 0 22%,var(--pur) 22% 42%,transparent 42%),repeating-linear-gradient(90deg,#c9c5d6 0 28px,#b4afc6 28px 30px);border-radius:2px 2px 0 0}
.pole{position:absolute;bottom:0;width:6px;background:linear-gradient(90deg,#8d88a2,#c4c0d3 50%,#8d88a2);border-radius:2px}.pole.l{left:-136px}.pole.r{left:130px}
.board{position:absolute;left:-150px;width:300px;height:118px;perspective:800px;pointer-events:auto;cursor:pointer;border-radius:6px;transition:transform .5s,box-shadow .5s;box-shadow:0 5px 14px rgba(40,30,80,.2);transform:scale(var(--bs,1));transform-origin:50% 100%}
.fi{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .65s cubic-bezier(.4,.2,.2,1)}
.ff,.fb{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:6px;padding:10px 12px}
.ff{background:#f4f4f7;border:2px solid #d6d6de;display:grid;grid-template-columns:1fr 92px;gap:6px}
.fb{transform:rotateY(180deg);background:linear-gradient(135deg,#6a3aa8,#3b2475);color:#f6efe2;display:flex;flex-direction:column;gap:5px;border:2px solid #a23fc0}
.bh{display:flex;align-items:center;gap:7px}.bh img{width:22px;height:22px;background:#fff;border-radius:50%;padding:2px;object-fit:contain}.bh b{font-size:15px;font-weight:800}.bh em{margin-left:auto;font-style:normal;font-size:9px;font-weight:800;letter-spacing:.04em;background:#e8a273;color:#2a1f5a;padding:2px 7px;border-radius:99px;white-space:nowrap}
.fb p{font-size:12px;line-height:1.35;flex:1}.fb small{font-size:10px;opacity:.75;letter-spacing:.03em}
.bl{display:flex;flex-direction:column;justify-content:center;min-width:0}.en{display:flex;align-items:center;gap:8px}.en img{width:30px;height:30px;flex:none;object-fit:contain}.en b{color:#a867b3;font-weight:800;white-space:nowrap;letter-spacing:-.01em}
.bl hr{border:0;height:3px;width:58px;background:#a867b3;margin:8px 0 6px}.mr{color:#a867b3;font-size:24px;font-weight:600;line-height:1.15;white-space:nowrap}
.br{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}.br .mm{font-size:11px;font-weight:800;color:#555062}.br svg{width:52px;height:52px}.br .pm{font-size:9px;font-weight:800;letter-spacing:.05em;color:#6b6676}
.st.on .board{box-shadow:0 0 0 3px var(--pur),0 14px 30px rgba(162,63,192,.38)}
.board:hover,.board.fl{z-index:5;transform:translateY(-12px) scale(calc(var(--bs,1)*1.3))}.board:hover .fi,.board.fl .fi{transform:rotateY(180deg)}
#train{position:absolute;left:50%;bottom:90px;width:var(--tw);margin-left:calc(var(--tw)/-2);filter:drop-shadow(0 8px 6px rgba(40,30,80,.28))}
#train svg{display:block;width:100%;height:auto;overflow:visible}
.beamlight{animation:pulse 3s ease-in-out infinite}@keyframes pulse{50%{opacity:.55}}
.wheel{transform-box:fill-box;transform-origin:center}
@media (max-width:640px){:root{--tw:330px;--th:61px;--bs:.74}}
</style></head><body>
<section class="hero" id="hero">
 <div class="scene" aria-hidden="true">
  <div class="layer" id="far"></div><div class="layer" id="sky"></div><div class="layer" id="near"></div>
  <div id="world"></div>
  <div id="train"></div>
 </div>
</section>
